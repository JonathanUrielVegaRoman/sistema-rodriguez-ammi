# INTEGRACIÓN CONTINUA (CI)
#
# Cada vez que alguien sube cambios (push) o abre un Pull Request, GitHub enciende una
# computadora limpia, descarga el proyecto y corre TODAS las pruebas. Si algo se rompió,
# aparece una ✗ roja junto al commit ANTES de que llegue al negocio.
#
# Es la red de seguridad del trabajo en equipo: aunque a uno se le olvide correr las
# pruebas en su computadora, aquí se corren siempre.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas del backend
        working-directory: backend
        run: sh ./mvnw -B -q test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Pruebas del frontend
        working-directory: frontend
        run: npm test
      - name: Compilar
        working-directory: frontend
        run: npm run build
