# =====================================================================
#  CONFIGURACIÓN DEL BACKEND
#  Es el "tablero de perillas": aquí se dice a qué base de datos
#  conectarse, en qué puerto escuchar, etc.
#
#  ${VARIABLE:valor} significa: "usa la variable de entorno VARIABLE;
#  si no existe, usa 'valor'". Así las contraseñas reales NO se suben a GitHub.
# =====================================================================

spring.application.name=sistema-rodriguez-ammi

# Puerto del servidor. Desde otro dispositivo de la red: http://IP-DE-LA-PC:8080
server.port=8080

# --- Base de datos PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rodriguez_ammi}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ddl-auto=update: Hibernate crea o actualiza las tablas a partir de las clases @Entity.
# Es cómodo para empezar. Cuando el sistema ya tenga datos reales, conviene pasar a
# migraciones con Flyway (ver docs/06-ideas-y-pendientes.md).
spring.jpa.hibernate.ddl-auto=update

# No mantener conexiones abiertas durante la vista (buena práctica).
spring.jpa.open-in-view=false

# La consola web de H2 solo se usa en el perfil de prueba (application-h2.properties).
# Aquí se apaga explícitamente: DevTools la enciende sola y no debe quedar abierta en la red.
spring.h2.console.enabled=false

# Muestra en consola el SQL que Hibernate genera. Útil para aprender; ponlo en false si estorba.
spring.jpa.show-sql=false

# Archivos subidos (fotos de armazones y buzón de impresión): tamaño máximo.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

# --- Acceso ---
# PIN que escribe el personal UNA vez en cada celular (queda recordado 1 año).
app.acceso.pin=${APP_PIN:1234}
# Contraseña del dueño para reportes y configuración (la sesión dura unas horas).
app.acceso.admin-password=${APP_ADMIN_PASSWORD:admin123}
app.acceso.horas-admin=8

# --- Promociones de la óptica ---
app.promociones.cumpleanos-porcentaje=15
app.promociones.cumpleanos-dias-vigencia=30

# --- Buzón de impresión ---
# Horas que se guardan los archivos de los clientes antes de borrarse solos (confidencialidad).
app.impresiones.horas-retencion=24

# Carpeta donde se guardarán las fotos (fuera del proyecto, para no subirlas a GitHub).
app.archivos.carpeta=${APP_ARCHIVOS:C:/sistema-rodriguez-ammi-datos/archivos}

# --- Bitácora (logs) ---
# Además de la consola, se guarda en un archivo para poder revisar qué pasó si algo falla
# en el negocio ("ayer a las 5 no dejó cobrar"). Se conservan 14 días; cada archivo pesa máx. 5 MB.
logging.file.name=${APP_LOGS:C:/sistema-rodriguez-ammi-datos/logs/sistema.log}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=14

# Si la base tarda más de 10 s en soltar un candado, se avisa en vez de quedarse esperando.
spring.jpa.properties.jakarta.persistence.lock.timeout=10000

# Zona horaria del negocio (importante para el "corte del día").
spring.jackson.time-zone=America/Mexico_City
