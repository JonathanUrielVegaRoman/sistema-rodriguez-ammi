# =====================================================================
#  PERFIL "h2": para probar SIN instalar PostgreSQL.
#  Se activa así:   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#  La base vive en memoria: al apagar el servidor, se pierde todo.
#  Al arrancar se cargan productos de ejemplo (ver comun/config/DatosDemo.java).
# =====================================================================

spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web para ver las tablas: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:demo)
spring.h2.console.enabled=true

app.archivos.carpeta=./archivos-demo

# En modo prueba la bitácora solo va a la consola (no se escribe archivo).
logging.file.name=
